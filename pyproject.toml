[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-catalog-tools"
dynamic = ["version"]
description = "Automated checks of gravitational-wave parameter estimation results, for catalogue production."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Williams", email = "daniel.williams@ligo.org" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
]

[project.optional-dependencies]
# What the tests which run inside an asimov project need.
asimov = [
    "asimov>=0.7",
    "bilby_pipe",
    "dill",
]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/transientlunatic/gw-catalog-tools"
Issues = "https://github.com/transientlunatic/gw-catalog-tools/issues"
Source = "https://github.com/transientlunatic/gw-catalog-tools"

[project.scripts]
catalog-tools = "catalog_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
